    }
    getReports().getXml().setDestination(file("${buildDir}/reports/jacoco/jacocoRootReport/merged.xml"))
    getReports().getHtml().setDestination(file("${buildDir}/reports/jacoco/jacocoRootReport/html"))

    def fileFilter = ['**/R.class','**/R$*.class','**/BuildConfig.*','**/Manifest*.*','**/*Test*.*','android/**/*.*','**/*$ViewBinder*.*']
    def debugTree = fileTree(dir: "$project.buildDir/intermediates/javac/debug/classes/", excludes: fileFilter)
    def mainSrc = "$project.projectDir/src/main/java"
    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: project.buildDir, includes: [
            'jacoco/testDebugUnitTest.exec', 'outputs/code-coverage/connected/*coverage.ec'
    ]))
}

tasks.coveralls {
    dependsOn 'jacocoTestReport'
}

coveralls {
    jacocoReportPath = "${buildDir}/reports/jacoco/jacocoRootReport/merged.xml"
}

version = project.findProperty('VERSION_NAME') ?: "1.2.1-SNAPSHOT"

def properties = new Properties()
def githubPropsFile = rootProject.file("github.properties")
if (githubPropsFile.exists()) {
    properties.load(new FileInputStream(githubPropsFile))
}

def publicationArtifactId = project.findProperty('POM_SETTING_ARTIFACT_ID') ?: project.name

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            /**
             * Configure path of the package repository on Github using the GITHUB_USER_ID and
             * Git Repository
             */
            url = uri("https://maven.pkg.github.com/BlueCodeSystems/opensrp-client-ecap-chw-core")
            credentials {
                /**
                 * Get credentials from local.properties in root project folder file with
                 * gpr.usr=GITHUB_USER_ID &  gpr.key=PERSONAL_ACCESS_TOKEN
                 * otherwise set env variable GPR_USER & GPR_API_KEY
                 */
                username = properties['gpr.usr'] ?: System.getenv("GPR_USER")
                password = properties['gpr.key'] ?: System.getenv("GPR_API_KEY")
            }
        }
    }
}

// KAPT defaults are sufficient for AGP 8.x; no custom flags needed

afterEvaluate {
    publishing {
        publications {
            if (!findByName("ChwCore")) {
                create("ChwCore", MavenPublication) {
                    def releaseComponent = components.findByName("ecapRelease") ?: components.findByName("release")
                    if (releaseComponent == null) {
                        logger.warn("Skipping Maven publication: no release component available")
                    } else {
                        from(releaseComponent)
                    }
                    groupId = 'org.smartregister'
                    artifactId = publicationArtifactId
                    version = project.version?.toString()
                    pom {
                        name = 'ECAP CHW Core'
                        description = 'A module of OPENSRP CHW-Core library that holds common CHW based funtionalities'
                        url = 'https://github.com/BlueCodeSystems/opensrp-client-ecap-chw-core'
                        licenses {
                            license {
                                name = 'The Apache License, Version 2.0'
                                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            }
                        }
                    }
                }
            }
        }
    }
}

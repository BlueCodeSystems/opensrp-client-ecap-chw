        exclude group: 'androidx.appcompat'
        exclude group: 'io.github.bluecodesystems', module: 'opensrp-client-immunization'
        exclude group: 'io.github.bluecodesystems', module: 'opensrp-client-core'
        exclude group: 'io.github.bluecodesystems', module: 'opensrp-client-utils'
        exclude group: 'io.github.bluecodesystems', module: 'opensrp-client-native-form-new'
        exclude group: 'io.github.bluecodesystems', module: 'circleprogressbar'
    }
    api('com.github.BlueCodeSystems:opensrp-client-immunization:v5.1.1') {

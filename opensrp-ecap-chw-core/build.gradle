buildscript {
    ext.kotlinVersion = '1.9.23'
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'jacoco'
apply plugin: 'com.github.kt3k.coveralls'
apply plugin: 'maven-publish'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

jacoco {
    toolVersion = "0.8.5"
}

def githubProperties = new Properties()
if (project.rootProject.file("local.properties").exists()) {
    githubProperties.load(new FileInputStream(rootProject.file("local.properties")))
} else if (project.rootProject.file("github.properties").exists()) {
    githubProperties.load(new FileInputStream(rootProject.file("github.properties")))
}

android {
    namespace = "org.smartregister.chw.core"
    useLibrary 'org.apache.http.legacy'
    compileSdkVersion 35
    buildToolsVersion "35.0.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 2
        versionName "v2.0.0"
        // multidex not required (minSdk 28+)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            testCoverageEnabled true
        }
    }

    lint {
        checkReleaseBuilds true
        abortOnError true
    }

    // avoid errors with message 'Duplicate files copied in APK ...'
    packaging {
        resources {
            excludes += [
                'LICENSE.txt',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0'
            ]
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }

        unitTests.all {
            jvmArgs "-Xmx3g"
        }
    }

    // Ensure sources and javadoc jars for publishing
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

}

// Apply publishing wiring after android is fully configured (ensures compileSdk is set)
apply from: '../maven.gradle'

tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
}

// Align/override transitive deps to avoid duplicate-manifest namespaces
    configurations.all {
    // Prefer newer CWAC Saferoom.X and drop legacy Saferoom
    exclude group: 'com.commonsware.cwac', module: 'saferoom'
    // Use one Hellocharts artifact; keep library, drop android flavor
    exclude group: 'com.github.lecho', module: 'hellocharts-android'
    // Block legacy Ona artifacts brought transitively by older native-form
    exclude group: 'io.ona.CircleProgressbar', module: 'lib'
    exclude group: 'io.ona.rdt-capture', module: 'lib'
    // Do not exclude DataBinding artifacts; AGP wires them automatically
    // Drop Mapbox GeoJSON/Turf in favor of MapLibre
    exclude group: 'com.mapbox.mapboxsdk', module: 'mapbox-sdk-geojson'
    exclude group: 'com.mapbox.mapboxsdk', module: 'mapbox-sdk-turf'
        // Ensure only one MaterialEditText artifact (keep MaterialEditTextLibrary)
    exclude group: 'io.github.bluecodesystems', module: 'materialedittext'
    exclude group: 'com.rengwuxian.materialedittext', module: 'library'
    // Ensure only one Volley (use AndroidX volley)
    exclude group: 'com.mcxiaoke.volley', module: 'library'

        resolutionStrategy {
            // Ensure we resolve to the requested JitPack variants
            dependencySubstitution {
                substitute module('io.github.bluecodesystems:android-p2p-sync') using module('com.github.BlueCodeSystems:android-p2p-sync:v0.4.3')
                substitute module('io.github.bluecodesystems:opensrp-client-core') using module('com.github.BlueCodeSystems:opensrp-client-core:v7.0.0')
                substitute module('com.github.BlueCodeSystems:opensrp-client-core') using module('com.github.BlueCodeSystems:opensrp-client-core:v7.0.0')
                substitute module('org.smartregister:opensrp-client-core') using module('com.github.BlueCodeSystems:opensrp-client-core:v6.2.2')
                // Route legacy OPD coordinates to BlueCodeSystems JitPack OPD
                substitute module('org.smartregister:opensrp-opd') using module('com.github.BlueCodeSystems:opensrp-client-opd:v1.0.3')
                // Route legacy native-form to BlueCodeSystems native-form-new
                substitute module('org.smartregister:opensrp-client-native-form') using module('com.github.BlueCodeSystems.opensrp-client-native-form-new:opensrp-client-native-form:v3.2.0')
                // Route SmartRegister configurable-views to BlueCodeSystems JitPack
                substitute module('org.smartregister:opensrp-client-configurable-views') using module('com.github.BlueCodeSystems:opensrp-client-configurable-views:v2.0.1')
                // Also route io.github group to JitPack coord to avoid Central/GH Packages lookups
                substitute module('io.github.bluecodesystems:opensrp-configurable-views') using module('com.github.BlueCodeSystems:opensrp-client-configurable-views:v2.0.1')
                substitute module('io.github.bluecodesystems:opensrp-client-immunization') using module('com.github.BlueCodeSystems:opensrp-client-immunization:v5.1.1')
                substitute module('io.github.bluecodesystems:opensrp-client-utils') using module('com.github.BlueCodeSystems:opensrp-client-utils:v1.0.0')
                substitute module('io.github.bluecodesystems:opensrp-client-native-form-new') using module('com.github.BlueCodeSystems.opensrp-client-native-form-new:opensrp-client-native-form:v3.2.0')
                substitute module('com.github.BlueCodeSystems.Opensrp-client-native-form-new:opensrp-client-native-form') using module('com.github.BlueCodeSystems.opensrp-client-native-form-new:opensrp-client-native-form:v3.2.0')
                substitute module('com.github.BlueCodeSystems.opensrp-client-native-form-new:circleprogressbar') using module('com.github.BlueCodeSystems.opensrp-client-native-form-new:circleprogressbar:v3.2.0')
                substitute module('com.github.BlueCodeSystems.Opensrp-client-native-form-new:circleprogressbar') using module('com.github.BlueCodeSystems.opensrp-client-native-form-new:circleprogressbar:v3.2.0')
                substitute module('io.github.bluecodesystems:circleprogressbar') using module('com.github.BlueCodeSystems.opensrp-client-native-form-new:circleprogressbar:v3.2.0')
                // Route CHW FP to BlueCodeSystems JitPack CHW Family Planning lib
                substitute module('org.smartregister:opensrp-chw-fp') using module('com.github.BlueCodeSystems:opensrp-client-chw-family-planning:v1.0.27')
                // Also route Maven Central coord to JitPack artifact
                substitute module('io.github.bluecodesystems:opensrp-chw-family-planning') using module('com.github.BlueCodeSystems:opensrp-client-chw-family-planning:v1.0.27')
                // Route FP client to BlueCodeSystems JitPack FP v2.1.0
                substitute module('org.smartregister:opensrp-client-fp') using module('com.github.BlueCodeSystems:opensrp-client-fp:v2.1.0')
                substitute module('io.github.bluecodesystems:opensrp-client-fp') using module('com.github.BlueCodeSystems:opensrp-client-fp:v2.1.0')
                // Route io.github.bluecodesystems:materialedittext to the forked artifact name
                substitute module('io.github.bluecodesystems:materialedittext') using module('io.github.bluecodesystems:MaterialEditTextLibrary:3.1.5')
                substitute module('org.smartregister:opensrp-client-immunization') using module('com.github.BlueCodeSystems:opensrp-client-immunization:v5.1.1')
                substitute module('org.smartregister:opensrp-client-chw-anc') using module('com.github.BlueCodeSystems.opensrp-client-chw-anc:opensrp-client-chw-anc:v2.0.0')
                substitute module('org.smartregister:opensrp-client-growth-monitoring') using module('com.github.BlueCodeSystems:opensrp-client-growth-monitoring:v3.0.0')
                substitute module('org.smartregister:opensrp-client-thinkmd') using module('com.github.BlueCodeSystems:pulsebridge:0.1.1-local')
                substitute module('org.smartregister:opensrp-household') using module('com.github.BlueCodeSystems:opensrp-household:v2.1.3')
                substitute module('org.smartregister:opensrp-client-household') using module('com.github.BlueCodeSystems:opensrp-household:v2.1.3')
                substitute module('io.github.bluecodesystems:opensrp-client-household') using module('com.github.BlueCodeSystems:opensrp-household:v2.1.3')
            }
        // Lock the Saferoom.X version
        force 'com.commonsware.cwac:saferoom.x:1.3.0'
        force 'com.google.guava:guava:33.2.1-android'
        // Keep Easy Rules on 3.4.0; JsonWizard is compiled against org.jeasy.rules.core.*
        force 'org.jeasy:easy-rules-core:3.4.0'
        force 'org.jeasy:easy-rules-support:3.4.0'
        force 'org.jeasy:easy-rules-mvel:3.4.0'
        
            // No forced versions here; dependencySubstitution above pins the coord + version
    }
}
dependencies {
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'io.realm:realm-android-library:10.19.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    // Evernote Android Job (for BaseJob, Job, JobRequest, etc.)
    implementation 'com.evernote:android-job:1.4.3'
    // MapLibre GL (v9 API-compatible)
    implementation 'org.maplibre.gl:android-sdk:9.6.0'
    implementation('io.ona.kujaku:library:0.10.8-SNAPSHOT') {
        exclude group: 'com.android.volley', module: 'volley'
        exclude group: 'stax', module: 'stax-api'
        // Avoid bundling Mapbox SDK; rely on MapLibre GL declared above
        exclude group: 'com.mapbox.mapboxsdk', module: 'mapbox-android-sdk'
    }
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "id.zelory:compressor:2.1.1"
    // Use AndroidX Volley; exclude old mcxiaoke volley transitively in configurations
    implementation 'com.android.volley:volley:1.2.1'
    // SQLCipher for net.sqlcipher.*
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    // AndroidX SQLite APIs (SupportSQLiteDatabase)
    implementation 'androidx.sqlite:sqlite:2.4.0'
    implementation 'com.google.guava:guava:33.2.1-android'
    // UI widgets referenced in XML/layouts
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.rey5137:material:1.2.5'
    // AndroidX Volley for networking used by core ImageLoaderRequest
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.github.BlueCodeSystems.opensrp-client-native-form-new:circleprogressbar:v3.2.0'
   // implementation 'com.jakewharton:butterknife:9.0.0-SNAPSHOT'

    implementation 'com.ibm.fhir:fhir-model:4.7.1'

    // Easy Rules (align with JsonWizard dependency compiled against v3.x)
    api 'org.jeasy:easy-rules-core:3.4.0'
    api 'org.jeasy:easy-rules-support:3.4.0'
    api 'org.jeasy:easy-rules-mvel:3.4.0'

    implementation 'com.github.BlueCodeSystems:pulsebridge:0.1.1-local'
    api('com.github.BlueCodeSystems.opensrp-client-native-form-new:opensrp-client-native-form:v3.2.0') {
        transitive = true
        exclude group: 'com.android.support', module: 'appcompat-v7'
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'com.android.support', module: 'cardview-v7'
        exclude group: 'com.android.support', module: 'support-media-compat'
        exclude group: 'com.android.support', module: 'support-v4'
        exclude group: 'com.android.support', module: 'design'
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'org.smartregister', module: 'opensrp-client-simprints'
        exclude group: 'org.smartregister', module: 'opensrp-client-core'
    }
    // Prefer BlueCode utils to avoid duplicate classes with org.smartregister utils
    // Prefer BlueCode fork of simprints to avoid duplicate classes
//    api('org.smartregister:opensrp-client-simprints:1.1.0-SNAPSHOT@aar') {
//      transitive = true
//      exclude group: 'com.android.support', module: 'appcompat-v7'
//      exclude group: 'com.android.support', module: 'design'
//      exclude group: 'com.android.support', module: 'design'
//      exclude group: 'com.simprints:', module: 'libsimprints'
//    }
    implementation "io.github.bluecodesystems:opensrp-client-simprints:1.1.0"
    api 'com.simprints:libsimprints:2024.2.2'

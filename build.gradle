// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    ext.kotlinVersion = '1.9.23'
    ext.koinVersion = '2.0.1'
    ext.espressoVersion = '3.2.0'
    ext.dokkaVersion = '0.10.1'

    repositories {
        mavenLocal()
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url 'https://maven.google.com' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
        classpath "gradle.plugin.org.kt3k.gradle.plugin:coveralls-gradle-plugin:2.12.2"
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:${dokkaVersion}"
        classpath "io.codearte.gradle.nexus:gradle-nexus-staging-plugin:0.30.0"
        classpath 'net.ltgt.gradle:gradle-errorprone-plugin:4.1.0'
        //        classpath 'gradle.plugin.com.onesignal:onesignal-gradle-plugin:[0.12.10, 0.99.99]'
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.23")
//        classpath 'com.google.gms:google-services:4.3.3'
//        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.3.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Apply nexus-staging on the root project only
apply plugin: 'io.codearte.nexus-staging'

def localProperties = new Properties()
if (rootProject.file("local.properties").exists()) {
    localProperties.load(new FileInputStream(rootProject.file("local.properties")))
}

// Load GitHub Packages credentials (for consuming private packages)
def githubProperties = new Properties()
if (rootProject.file("github.properties").exists()) {
    githubProperties.load(new FileInputStream(rootProject.file("github.properties")))
}

ext.useLocalNativeForm = project.hasProperty('useLocalNativeForm')
        ? project.property('useLocalNativeForm').toString().toBoolean()
        : false

allprojects {

    tasks.whenTaskAdded { task ->
        if (task.name == "lint") {
            task.enabled = false
        }
    }
}

project.ext.preDexLibs = !project.hasProperty('disablePreDex')

subprojects {

    group = 'org.smartregister'

    ext.androidToolsBuildGradle = '4.0.1'
    ext.androidBuildToolsVersion = '35.0.0'
    ext.androidMinSdkVersion = 28
    ext.androidCompileSdkVersion = 35
    ext.androidTargetSdkVersion = 35

    project.ext {
        if (project.hasProperty('preDexEnable')) {
            project.ext.preDexLibs = project.properties['preDexEnable'].equals('true')
        } else {
            project.ext.preDexLibs = true // pre dexing should be true by default
        }

        println('PREDEX ' + (project.ext.preDexLibs ? 'ENABLED' : 'DISABLED')) // goes to build log or console output
    }
    // Improve build server performance by allowing disabling of pre-dexing
    // (see http://tools.android.com/tech-docs/new-build-system/tips#TOC-Improving-Build-Server-performance.)
/*    project.plugins.whenPluginAdded { plugin ->
        if ("com.android.build.gradle.AppPlugin".equals(plugin.class.name)) {
            project.android.dexOptions.preDexLibraries = rootProject.ext.preDexLibs
        } else  {
            project.android.dexOptions.preDexLibraries = rootProject.ext.preDexLibs
        }
    }*/
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

def isReleaseBuild() {
    return version.contains("SNAPSHOT") == false
}

// Sonatype Nexus Staging configuration (root only)
ext.getSonatypeUsername = {
    hasProperty('sonatypeUsername') ? sonatypeUsername : System.getenv('SONATYPE_USERNAME') ?: ""
}
ext.getSonatypePassword = {
    hasProperty('sonatypePassword') ? sonatypePassword : System.getenv('SONATYPE_PASSWORD') ?: ""
}

nexusStaging {
    serverUrl = "https://s01.oss.sonatype.org/service/local/"
    username = getSonatypeUsername()
    password = getSonatypePassword()
}

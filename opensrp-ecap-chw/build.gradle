buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'org.apache.commons:commons-lang3:3.14.0'
        classpath 'com.android.tools.build:gradle:8.7.0'
        classpath 'com.google.gms:google-services:4.4.2'
//        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'com.google.gms:google-services:4.4.2'
//        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'jacoco'
apply plugin: 'com.github.kt3k.coveralls'
apply from: "jacoco.gradle"
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.kapt'
apply plugin: 'kotlin-kapt'
//apply plugin: 'com.google.gms.google-services'
//apply plugin: 'com.google.firebase.crashlytics'

jacoco {
    toolVersion = "0.8.5"
}

def githubProperties = new Properties()

//Read the local/github properties content
if (project.rootProject.file("local.properties").exists()) {
    githubProperties.load(new FileInputStream(rootProject.file("local.properties")))
} else if (project.rootProject.file("github.properties").exists()) {
    githubProperties.load(new FileInputStream(rootProject.file("github.properties")))
}


android {
    namespace  = "com.bluecodeltd.ecap.chw"
    useLibrary 'org.apache.http.legacy'
    compileSdkVersion 35
    buildToolsVersion '35.0.0'

    lint {
        // Keep lint strict but simple
        checkReleaseBuilds true
        abortOnError true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    defaultConfig {
        applicationId "com.bluecodeltd.chw"
        minSdk 28
        targetSdk 35
        versionCode 14
        versionName "v6.1.2"
        // multidex not required (minSdk 28+)
        buildConfigField "long", "MAX_SERVER_TIME_DIFFERENCE", "1800000l"
        buildConfigField "boolean", "TIME_CHECK", "false"
        buildConfigField "String", "SYNC_TYPE", '"teamId"'
        buildConfigField "int", "MAX_SYNC_RETRIES", '3'
        buildConfigField "long", "BUILD_TIMESTAMP", System.currentTimeMillis() + "L"
        buildConfigField "boolean", "IS_SYNC_SETTINGS", "false"
        buildConfigField "String", "THINKMD_BASE_URL", '"https://app.africa.thinkmd.tech"'
        buildConfigField "String", "THINKMD_END_POINT", '"/#/start"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        if (project.rootProject.file("local.properties").exists()) {

            Properties properties = new Properties()
            properties.load(project.rootProject.file("local.properties").newDataInputStream())

            if (properties != null && properties.containsKey("oauth.client.id")) {

                buildConfigField "String", "OAUTH_CLIENT_ID", properties["oauth.client.id"]

            } else {
                project.logger.error("oauth.client.id variable is not set in your local.properties")
                buildConfigField "String", "OAUTH_CLIENT_ID", "\"sample_client_id\""
            }


            if (properties != null && properties.containsKey("oauth.client.secret")) {

                buildConfigField "String", "OAUTH_CLIENT_SECRET", properties["oauth.client.secret"]

            } else {
                project.logger.error("oauth.client.secret variable is not set in your local.properties")
                buildConfigField "String", "OAUTH_CLIENT_SECRET", "\"sample_client_secret\""
            }

            if (properties != null &&
                    properties.containsKey("mapbox.sdk.token")) {
                buildConfigField "String", "MAPBOX_SDK_ACCESS_TOKEN", properties["mapbox.sdk.token"]
            } else {
                println("Mapbox key config variables is not set in your local.properties")
                buildConfigField "String", "MAPBOX_SDK_ACCESS_TOKEN", "\"sample_key\""
            }

        } else {
            println("local.properties does not exist")
            buildConfigField "String", "OAUTH_CLIENT_ID", "\"sample_client_id\""
            buildConfigField "String", "OAUTH_CLIENT_SECRET", "\"sample_client_secret\""
            buildConfigField "String", "MAPBOX_SDK_ACCESS_TOKEN", "\"sample_key\""
        }
    }

    // dexOptions is obsolete in AGP 8+; removed

    signingConfigs {
        release {
            def storeFileProp = findProperty("RELEASE_STORE_FILE")
            if (storeFileProp) {
                storeFile = rootProject.file(storeFileProp)
                storePassword = findProperty("RELEASE_STORE_PASSWORD") ?: ""
                keyAlias = findProperty("RELEASE_KEY_ALIAS") ?: ""
                keyPassword = findProperty("RELEASE_KEY_PASSWORD") ?: ""
            } else {
                println("Release signing config not set; provide RELEASE_* properties to sign builds.")
            }
        }
    }

    buildTypes {

        release {
            //debuggable true // Useful when debugging release builds
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "int", "OPENMRS_UNIQUE_ID_INITIAL_BATCH_SIZE", '200'
            buildConfigField "int", "OPENMRS_UNIQUE_ID_BATCH_SIZE", '200'
            buildConfigField "int", "OPENMRS_UNIQUE_ID_SOURCE", '4'
            buildConfigField "boolean", "TIME_CHECK", "true"
            buildConfigField "int", "DATA_SYNC_DURATION_MINUTES", '15'
            buildConfigField "int", "VACCINE_SYNC_PROCESSING_MINUTES", '30'
            buildConfigField "int", "IMAGE_UPLOAD_MINUTES", '180'
            buildConfigField "int", "PULL_UNIQUE_IDS_MINUTES", '180'
            buildConfigField "int", "HOME_VISIT_MINUTES", '60'
            buildConfigField "int", "REPORT_INDICATOR_GENERATION_MINUTES", '120'
            buildConfigField "int", "BASE_PNC_CLOSE_MINUTES", '1440'
            buildConfigField "int", "SCHEDULE_SERVICE_MINUTES", '720'
            buildConfigField "int", "STOCK_USAGE_REPORT_MINUTES", '1440'
            buildConfigField "boolean", "USE_UNIFIED_REFERRAL_APPROACH", "true"
            buildConfigField "boolean", "BUILD_FOR_BORESHA_AFYA_SOUTH", "false"
            if (signingConfigs.release?.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }

        debug {

            buildConfigField "int", "OPENMRS_UNIQUE_ID_INITIAL_BATCH_SIZE", '200'
            buildConfigField "int", "OPENMRS_UNIQUE_ID_BATCH_SIZE", '200'
            buildConfigField "int", "OPENMRS_UNIQUE_ID_SOURCE", '4'
            buildConfigField "boolean", "TIME_CHECK", "false"
            buildConfigField "int", "DATA_SYNC_DURATION_MINUTES", '15'
            buildConfigField "int", "VACCINE_SYNC_PROCESSING_MINUTES", '30'
            buildConfigField "int", "IMAGE_UPLOAD_MINUTES", '15'
            buildConfigField "int", "PULL_UNIQUE_IDS_MINUTES", '15'
            buildConfigField "int", "HOME_VISIT_MINUTES", '60'
            buildConfigField "int", "REPORT_INDICATOR_GENERATION_MINUTES", '120'
            buildConfigField "int", "BASE_PNC_CLOSE_MINUTES", '1440'
            buildConfigField "int", "SCHEDULE_SERVICE_MINUTES", '360'
            buildConfigField "int", "STOCK_USAGE_REPORT_MINUTES", '1440'
            buildConfigField "boolean", "USE_UNIFIED_REFERRAL_APPROACH", "true"
            buildConfigField "boolean", "BUILD_FOR_BORESHA_AFYA_SOUTH", "false"
          //  testCoverageEnabled true
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES.txt'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/dependencies.txt'
        exclude 'META-INF/LGPL2.1'
        exclude 'LICENSE.txt'
    }

    buildFeatures {
        dataBinding false
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
        unitTests.all {
            systemProperty 'robolectric.enabledSdks', '28'
            jvmArgs '-noverify'
        }
    }

    configurations.all {
        // Drop Mapbox GeoJSON/Turf to avoid conflicts with MapLibre
        exclude group: 'com.mapbox.mapboxsdk', module: 'mapbox-sdk-geojson'
        exclude group: 'com.mapbox.mapboxsdk', module: 'mapbox-sdk-turf'
        // Ensure only one Core library is on classpath (allow BlueCodeSystems core; block legacy group)
        // exclude group: 'com.github.BlueCodeSystems', module: 'opensrp-client-core'
        exclude group: 'org.smartregister', module: 'opensrp-client-core'
        // Prefer the class bundled in household; drop standalone compressor
        exclude group: 'id.zelory', module: 'compressor'
        // Ensure only one MaterialEditText artifact (prefer BlueCodeSystems fork)
        exclude group: 'com.rengwuxian.materialedittext', module: 'library'
        exclude group: 'io.github.bluecodesystems', module: 'materialedittext'
        // Ensure only one configurable-views artifact
        exclude group: 'io.github.bluecodesystems', module: 'opensrp-configurable-views'
        // Ensure only one Volley (use AndroidX volley)
        exclude group: 'com.mcxiaoke.volley', module: 'library'
        // Android already ships XmlPull; drop legacy jar to keep R8 happy.
        exclude group: 'xmlpull', module: 'xmlpull'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'xpp3', module: 'xpp3_min'
        resolutionStrategy {
            // Unify configurable-views to BlueCodeSystems JitPack coord
            dependencySubstitution {
                substitute module('io.github.bluecodesystems:opensrp-configurable-views') using module('com.github.BlueCodeSystems:opensrp-client-configurable-views:v2.0.1')
                substitute module('org.smartregister:opensrp-client-configurable-views') using module('com.github.BlueCodeSystems:opensrp-client-configurable-views:v2.0.1')
                // Route original MaterialEditText to BlueCodeSystems fork to avoid duplicates
                substitute module('com.rengwuxian.materialedittext:library') using module('io.github.bluecodesystems:MaterialEditTextLibrary:3.1.5')
                // Ensure any reference to io.github.bluecodesystems:materialedittext resolves to the fork artifact
                substitute module('io.github.bluecodesystems:materialedittext') using module('io.github.bluecodesystems:MaterialEditTextLibrary:3.1.5')
                // Use legacy household coord as-is (avoid JitPack variant to reduce duplicates)
            }
            // Align vector drawables to avoid mixed-namespace warning
            force 'androidx.vectordrawable:vectordrawable:1.1.0'
            force 'androidx.vectordrawable:vectordrawable-animated:1.1.0'
            // Align AppCompat and Material to modern versions used by this app
            force 'androidx.appcompat:appcompat:1.7.0'
            // Ensure Material Components is recent enough for ThemeOverlay.MaterialComponents.MaterialAlertDialog
            force 'com.google.android.material:material:1.12.0'
        }
    }

    // Only package ARM ABIs to drop emulator-native binaries (~50 MB saved).
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    flavorDimensions 'baseDimension'
    productFlavors {
        ecap {
            dimension = 'baseDimension'
            applicationIdSuffix ".ecap"
            versionCode 33
            versionName "v7.0.0"
            buildConfigField "String", 'opensrp_url', '"https://opensrp.ecap.bluecodeltd.com/opensrp/"'
            buildConfigField "String", 'guidebooks_url', '"https://opensrp.s3.amazonaws.com/media/ba/"'
            buildConfigField "String", 'opensrp_url_debug', '"https://opensrp.ecap.bluecodeltd.com/opensrp/"'
            buildConfigField "String[]", "LOCATION_HIERACHY", '{"Country","Province","District","Ward","Health Facility"}'
            buildConfigField "String[]", "ALLOWED_LOCATION_LEVELS", '{"Country","Province","District","Ward","Health Facility"}'
            buildConfigField "String[]", "ALLOWED_LOCATION_LEVELS_DEBUG", '{"Country","Province","District","Ward","Health Facility"}'
            buildConfigField "String", 'DEFAULT_LOCATION', '"Health Facility"'
            buildConfigField "String", 'DEFAULT_LOCATION_DEBUG', '"Health Facility"'
            buildConfigField "int", "DATABASE_VERSION", '24'
        }
    }
}

// Align/override transitive deps to avoid duplicate-manifest namespaces
configurations.all {
    // Prefer newer CWAC Saferoom.X and drop legacy Saferoom
    exclude group: 'com.commonsware.cwac', module: 'saferoom'
    // Use one Hellocharts artifact; keep library, drop android flavor
    exclude group: 'com.github.lecho', module: 'hellocharts-android'
    exclude group: 'commons-logging', module: 'commons-logging'
    exclude group: 'com.github.BlueCodeSystems.Opensrp-client-native-form-new', module: 'opensrp-client-native-form'
    exclude group: 'com.github.BlueCodeSystems.Opensrp-client-native-form-new', module: 'circleprogressbar'
    // Ensure only one SQLCipher native binary (prefer android-database-sqlcipher)
    exclude group: 'net.zetetic', module: 'sqlcipher-android'

    resolutionStrategy {
        dependencySubstitution {
            substitute module('io.github.bluecodesystems:android-p2p-sync') using module('com.github.BlueCodeSystems:android-p2p-sync:v0.5.0')
            substitute module('io.github.bluecodesystems:opensrp-client-core') using module('com.github.BlueCodeSystems:opensrp-client-core:v7.0.0')
            substitute module('org.smartregister:opensrp-client-core') using module('com.github.BlueCodeSystems:opensrp-client-core:v7.0.0')
            substitute module('org.jeasy:easy-rules-core') using module('org.jeasy:easy-rules-core:3.4.0')
            substitute module('org.jeasy:easy-rules-support') using module('org.jeasy:easy-rules-support:3.4.0')
            substitute module('org.jeasy:easy-rules-mvel') using module('org.jeasy:easy-rules-mvel:3.4.0')
            substitute module('org.smartregister:opensrp-household') using module('com.github.BlueCodeSystems:opensrp-household:v2.1.3')
            substitute module('org.smartregister:opensrp-client-household') using module('com.github.BlueCodeSystems:opensrp-household:v2.1.3')
            substitute module('io.github.bluecodesystems:opensrp-client-household') using module('com.github.BlueCodeSystems:opensrp-household:v2.1.3')
            // Route CHW FP to BlueCodeSystems JitPack CHW Family Planning lib
            substitute module('org.smartregister:opensrp-chw-fp') using module('com.github.BlueCodeSystems:opensrp-client-chw-family-planning:v1.0.27')
            // Also route Maven Central coord to JitPack artifact
            substitute module('io.github.bluecodesystems:opensrp-chw-family-planning') using module('com.github.BlueCodeSystems:opensrp-client-chw-family-planning:v1.0.27')
            substitute module('org.smartregister:opensrp-client-immunization') using module('com.github.BlueCodeSystems:opensrp-client-immunization:v5.1.1')
            substitute module('io.github.bluecodesystems:opensrp-client-immunization') using module('com.github.BlueCodeSystems:opensrp-client-immunization:v5.1.1')
            substitute module('io.github.bluecodesystems:opensrp-client-native-form-new') using module('com.github.BlueCodeSystems.opensrp-client-native-form-new:opensrp-client-native-form:v3.2.2')
            substitute module('com.github.BlueCodeSystems.Opensrp-client-native-form-new:opensrp-client-native-form') using module('com.github.BlueCodeSystems.opensrp-client-native-form-new:opensrp-client-native-form:v3.2.2')
            substitute module('io.github.bluecodesystems:circleprogressbar') using module('com.github.BlueCodeSystems.opensrp-client-native-form-new:circleprogressbar:v3.2.2')
            substitute module('com.github.BlueCodeSystems.Opensrp-client-native-form-new:circleprogressbar') using module('com.github.BlueCodeSystems.opensrp-client-native-form-new:circleprogressbar:v3.2.2')
            substitute module('io.github.bluecodesystems:opensrp-client-utils') using module('com.github.BlueCodeSystems:opensrp-client-utils:v1.0.0')
            substitute module('org.smartregister:opensrp-client-chw-anc') using module('com.github.BlueCodeSystems.opensrp-client-chw-anc:opensrp-client-chw-anc:v2.0.0')
            substitute module('org.smartregister:opensrp-client-growth-monitoring') using module('com.github.BlueCodeSystems:opensrp-client-growth-monitoring:v3.0.0')
            substitute module('org.smartregister:opensrp-client-thinkmd') using module('com.github.BlueCodeSystems:pulsebridge:v0.1.1')
        }
        force 'com.commonsware.cwac:saferoom.x:1.3.0'
        force 'com.google.guava:guava:33.2.1-android'
        force 'org.jeasy:easy-rules-core:3.4.0'
        force 'org.jeasy:easy-rules-support:3.4.0'
        force 'org.jeasy:easy-rules-mvel:3.4.0'
    }
}
dependencies {
    implementation('com.github.BlueCodeSystems.kujaku:kujaku:v1.0.0') {
        exclude group: 'com.android.volley', module: 'volley'
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'com.mapbox.mapboxsdk', module: 'mapbox-android-sdk'
    }
    // Core library desugaring for Java 8+ APIs used by dependencies
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Household features and utilities will come from core module's transitive
    // dependency on org.smartregister:opensrp-household

    implementation 'com.github.BlueCodeSystems:neat-form:v1.1.7'
//    implementation "io.ona.rdt-capture:lib:2.1.0"
    implementation "com.ibm.fhir:fhir-model:4.7.1"
    implementation "com.ibm.fhir:fhir-path:4.7.1"
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    // CHW FP library (org.smartregister.chw.fp.*)
    implementation 'com.github.BlueCodeSystems:opensrp-client-chw-family-planning:v1.0.27'

    // CHW Referral library (org.smartregister.chw.referral.*)
    implementation 'com.github.BlueCodeSystems:opensrp-client-chw-referral:v2.0.0'

    // Configurable Views used directly in app presenters/fragments
    implementation 'com.github.BlueCodeSystems:opensrp-client-configurable-views:v2.0.1'

    implementation 'com.github.BlueCodeSystems:pulsebridge:v0.1.1'

    // AndroidX Preference (for PreferenceManager usage)
    implementation 'androidx.preference:preference:1.2.1'

    // CircleImageView used in databinding layouts
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Android-SpinKit (FadingCircle) used in JobAidsActivity
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'

//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    implementation(project(":opensrp-ecap-chw-core")) {
        transitive = true
        exclude group: 'com.android.support', module: 'appcompat-v7'
        exclude group: 'androidx.legacy', module: 'legacy-support-v4'
        exclude group: 'androidx.appcompat', module: 'appcompat'
        exclude group: 'androidx.constraintlayout', module: 'constraintlayout'
        exclude group: 'com.rengwuxian.materialedittext', module: 'library'
        exclude group: 'stax', module: 'stax-api'
//        exclude group: 'io.ona.kujaku', module: 'library'
        exclude group: 'com.github.lecho', module: 'hellocharts-library'
    }
//    implementation 'com.google.firebase:firebase-crashlytics:19.3.0'
    implementation 'com.github.javiersantos:AppUpdater:2.7'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    // MapLibre GL is used for the map renderer; Turf usage replaced with local util
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    // Rey Material widgets (for com.rey.material.widget.* used in XML)
    implementation 'com.github.rey5137:material:1.2.5'
    // AndroidX Volley for networking used in app code
    implementation 'com.android.volley:volley:1.2.1'
    // Evernote Job used by app jobs (JobCreator, Job)
    implementation 'com.evernote:android-job:1.4.3'
    implementation 'com.github.gcacace:signature-pad:1.3.1'
    implementation 'com.github.lecho:hellocharts-library:1.5.8@aar'
    // For viewing PDFs in the app (BlueCodeSystems fork)
        implementation 'com.github.BlueCodeSystems:AndroidPdfViewer:v2.0.0'
        implementation 'androidx.wear:wear:1.0.0'
        // Ensure AndroidX SQLite APIs available for any upgrade utilities referencing SupportSQLiteDatabase
        implementation 'androidx.sqlite:sqlite:2.4.0'
    //For Sentry
//    implementation 'io.sentry:sentry-android:5.1.2'
    //Custom Toast
    implementation 'com.github.GrenderG:Toasty:1.5.2'
    //SwipeToRefresh
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.5.0'
    //GSON
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    //Material Icons (do not include legacy support-v7 alongside AndroidX)
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.4'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.4'
    // Koin 3.x (required by referral v2 and app code)
    implementation 'io.insert-koin:koin-android:3.5.6'
    implementation 'io.insert-koin:koin-core:3.5.6'

    //For Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    kapt "androidx.databinding:databinding-compiler:8.7.0"
    // Core library desugaring for Java 8+ APIs used by dependencies
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'org.mockito:mockito-android:3.0.0'

    testImplementation "org.koin:koin-test:2.0.1"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.8.1'
    testImplementation 'org.robolectric:robolectric:4.13'
    // Removed legacy Robolectric shadows; not needed at minSdk 28+
    testImplementation 'androidx.test:core:1.6.1'
    implementation 'com.jakewharton:butterknife:10.2.3'
    kapt 'com.jakewharton:butterknife-compiler:10.2.3'
    compileOnly 'com.google.android.wearable:wearable:2.9.0'

    // core library desugaring not required for minSdk 28+

}

def flavors = android.productFlavors.collect { flavor -> flavor.name }
if (!flavors) flavors.add('')

def testDependencies = []
flavors.each { productFlavorName ->
    testDependencies.add("test${productFlavorName.capitalize()}DebugUnitTest")
    testDependencies.add("create${productFlavorName.capitalize()}DebugCoverageReport")
}

// task jacocoTestReport(type: JacocoReport, dependsOn: testDependencies.take(2)) {
task jacocoTestReport(type: JacocoReport, dependsOn: [
        'testTogoDebugUnitTest', 'createTogoDebugCoverageReport',
        'testBaDebugUnitTest', 'createBaDebugCoverageReport'
]) {

    reports {
//        xml.enabled = true
//        html.enabled = true
    }

    getReports().getXml().setDestination(file("${buildDir}/reports/jacoco/jacocoRootReport/merged.xml"))
    getReports().getHtml().setDestination(file("${buildDir}/reports/jacoco/jacocoRootReport/html"))

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*', '**/*$ViewBinder*.*']
    def debugTree = fileTree(dir: "$project.buildDir/intermediates/javac/baDebug/classes/", excludes: fileFilter)
    def mainSrc = "$project.projectDir/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: project.buildDir, includes: [
            'jacoco/testBaDebugUnitTest.exec', 'outputs/code-coverage/connected/*coverage.ec'
    ]))
}

tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
    maxHeapSize = "3g"
}

tasks.coveralls {
    dependsOn 'jacocoTestReport'
}

coveralls {
    jacocoReportPath = "${buildDir}/reports/jacoco/jacocoRootReport/merged.xml"
    sourceDirs = ["$project.projectDir/src/main/java"]
}
